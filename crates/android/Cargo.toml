[package]
name = "psx-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "psx"
crate-type = ["cdylib"]

[dependencies]
psx-player = { path = "../player" }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "=0.15.1"
ndk = { version = "=0.9.0", features = ["audio", "api-level-28"] }
jni = "=0.21.1"
libc = "0.2"
libloading = "=0.8.9"
khronos-egl = { version = "=6.0.0", features = ["static", "no-pkg-config"] }
glow = "=0.17.0"
font8x8 = "=0.3.1"
