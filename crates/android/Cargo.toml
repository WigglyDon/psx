[package]
name = "psx-android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "psx"
crate-type = ["cdylib"]

[features]
default = ["storage-scan"]
storage-scan = []
graphics-observer = ["psx-player/graphics-observer"]
no-game-image-reader = ["graphics-observer", "psx-player/no-game-image-reader"]
producer-local-output-sync = ["no-game-image-reader", "psx-player/producer-local-output-sync"]

[dependencies]
psx-player = { path = "../player" }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
android_logger = "=0.15.1"
ndk = { version = "=0.9.0", features = ["audio", "api-level-28"] }
jni = "=0.21.1"
libc = "0.2"
khronos-egl = { version = "=6.0.0", features = ["static", "no-pkg-config"] }
glow = "=0.17.0"
ab_glyph = "=0.2.32"
