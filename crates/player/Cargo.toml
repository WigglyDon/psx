[package]
name = "psx-player"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
libloading = "=0.8.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Runtime CPU-feature detection retains the portable fallback. The default
# SHA-256 backend in this pinned version otherwise stays software on ARM64.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10.9", features = ["asm-aarch64"] }
